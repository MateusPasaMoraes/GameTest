<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap');
:root{--ink:#e7e5d9;--muted:#9a9d8e;--line:#ffffff1a;--panel:#171d19f2;--olive:#a5ae78;--rust:#bb7755;--gold:#d8b877;--mono:'DM Mono',monospace;--display:'Oswald',sans-serif;--body:'DM Sans',sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101512;color:var(--ink);font-family:var(--body)}button{font:inherit;color:inherit;cursor:pointer}#game{position:fixed;inset:0;background:#131a15}canvas{display:block;width:100%;height:100%}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,#070b09a6 100%);z-index:1}.grain{position:fixed;inset:0;opacity:.035;pointer-events:none;z-index:2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
.topbar{position:fixed;z-index:4;left:28px;right:28px;top:23px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{pointer-events:auto}.brand small{display:block;font:10px var(--mono);letter-spacing:.23em;color:var(--olive);margin-bottom:3px}.brand strong{font:500 27px var(--display);letter-spacing:.12em}.brand em{font:11px var(--mono);font-style:normal;color:#a8aa9e;letter-spacing:.1em;margin-left:10px}.topright{display:flex;gap:12px;align-items:center}.clock{padding:9px 13px;background:#141a16ce;border:1px solid var(--line);font:11px var(--mono);letter-spacing:.08em}.clock b{font-weight:400;color:var(--gold);margin-right:8px}.iconbtn{pointer-events:auto;width:37px;height:37px;border:1px solid var(--line);background:#141a16d9;display:grid;place-items:center;font-size:16px}.iconbtn:hover,.action:hover{border-color:#a5ae7880;background:#222a22}
.status{position:fixed;z-index:4;left:28px;top:105px;width:210px;padding:13px 15px;background:#131a16d9;border:1px solid var(--line);backdrop-filter:blur(8px)}.status-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.status-head span:first-child{font:10px var(--mono);letter-spacing:.12em;color:#d4d3c7}.status-head span:last-child{font:9px var(--mono);color:var(--olive)}.stat{display:grid;grid-template-columns:19px 1fr 30px;gap:7px;align-items:center;margin:9px 0}.stat .ico{font-size:12px;color:#c5c6ad}.stat label{font:9px var(--mono);color:#afb1a3;letter-spacing:.08em}.meter{height:3px;background:#ffffff1a;margin-top:5px}.meter i{height:100%;display:block;background:var(--olive);transition:width .3s}.stat small{font:9px var(--mono);text-align:right;color:#c9cabb}
.location{position:fixed;z-index:4;top:107px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 2px 6px #000}.location strong{font:500 17px var(--display);letter-spacing:.17em}.location span{display:block;font:9px var(--mono);letter-spacing:.14em;color:#b1b5a4;margin-top:3px}.bottomleft{position:fixed;z-index:4;left:28px;bottom:25px;display:flex;align-items:center;gap:12px}.portrait{width:36px;height:36px;background:linear-gradient(145deg,#59654d,#2b372d);border:1px solid #ffffff36;display:grid;place-items:center;font-size:19px}.charname{font:11px var(--mono);letter-spacing:.08em}.charname small{display:block;font-size:9px;color:var(--muted);margin-top:4px}.hotbar{position:fixed;z-index:4;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:5px}.slot{width:48px;height:48px;border:1px solid #ffffff26;background:#111713cf;position:relative;display:grid;place-items:center;font-size:20px}.slot.active{border-color:var(--olive);box-shadow:inset 0 0 0 1px #a5ae7840}.slot small{position:absolute;left:4px;top:3px;font:8px var(--mono);color:#a6a99a}.slot b{position:absolute;right:4px;bottom:2px;font:9px var(--mono);font-weight:400}.hint{position:fixed;z-index:4;right:28px;bottom:28px;font:9px var(--mono);letter-spacing:.07em;color:#c3c4b8;text-align:right}.hint kbd{padding:4px 6px;border:1px solid #ffffff35;background:#131a16b8;color:#e3e1d4;margin-left:5px}.interact{position:fixed;z-index:4;left:50%;top:56%;transform:translate(-50%,-50%);padding:8px 11px;background:#111713e8;border:1px solid #a5ae7860;font:10px var(--mono);color:#e8e5d7;display:none;pointer-events:none}.interact b{color:var(--gold);font-weight:400}.toast{position:fixed;z-index:8;left:50%;top:82px;transform:translate(-50%,-8px);padding:9px 13px;background:#171d19ed;border:1px solid var(--line);font:10px var(--mono);opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;z-index:7;inset:0;background:#080b09a8;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}.overlay.open{display:flex}.window{width:min(720px,94vw);max-height:86vh;background:#171d19f5;border:1px solid #ffffff2a;box-shadow:0 22px 80px #0009;display:flex;flex-direction:column}.window-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.window-head small{display:block;font:9px var(--mono);color:var(--olive);letter-spacing:.18em;margin-bottom:4px}.window-head h2{margin:0;font:500 22px var(--display);letter-spacing:.11em}.close{background:none;border:0;color:#aeb1a2;font-size:22px}.window-body{padding:20px 22px;overflow:auto}.invgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section-title{font:9px var(--mono);letter-spacing:.13em;color:#a8ac9a;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:9px}.item{display:flex;align-items:center;gap:10px;padding:9px 7px;border-bottom:1px solid #ffffff0c}.item .itemico{font-size:20px;width:28px}.item .itemname{font-size:12px;flex:1}.item small{font:9px var(--mono);color:#969b8b}.item button,.recipe button{border:1px solid #ffffff26;background:#222a23;padding:5px 8px;font:9px var(--mono)}.item button:hover,.recipe button:hover{border-color:var(--olive)}.empty{font:11px var(--mono);color:#8e9385;padding:16px 3px}.recipe{border:1px solid var(--line);padding:12px;margin:9px 0;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.recipe strong{font-size:12px;font-weight:500}.recipe small{display:block;color:#9da193;font:9px var(--mono);margin-top:5px}.recipe button:disabled{opacity:.35;cursor:not-allowed}.footnote{font:9px var(--mono);color:#93998a;padding-top:12px}.help{position:fixed;z-index:5;right:28px;top:83px;font:9px var(--mono);color:#b0b3a5;text-align:right;line-height:1.9}.help span{color:var(--gold)}
@media(max-width:700px){.topbar{left:14px;right:14px;top:13px}.brand strong{font-size:21px}.brand em{display:none}.clock{font-size:9px;padding:8px}.status{left:14px;top:79px;width:165px;padding:10px}.stat{margin:7px 0;grid-template-columns:15px 1fr 25px}.location{top:82px;left:auto;right:14px;transform:none}.location strong{font-size:13px}.location span{font-size:7px}.help{display:none}.bottomleft{left:14px;bottom:17px}.hotbar{bottom:12px}.slot{width:38px;height:40px}.hint{right:12px;bottom:63px;font-size:8px}.invgrid{grid-template-columns:1fr}.window-head,.window-body{padding:14px}.interact{top:63%}}
</style>

<body><main id="game"><canvas id="world"></canvas></main><div class="vignette"></div><div class="grain"></div>
<header class="topbar"><div class="brand"><small>UM MUNDO DEPOIS</small><strong>AFTERMATH</strong><em>DIAS SILENCIOSOS</em></div><div class="topright"><div class="clock"><b id="weather">☁</b><span id="clock">DIA 01 · 08:00</span></div><button class="iconbtn" id="saveBtn" title="Salvar">⌑</button></div></header>
<section class="status"><div class="status-head"><span>CONDIÇÃO</span><span id="condition">ESTÁVEL</span></div><div id="stats"></div></section>
<div class="location"><strong>MAPLEWOOD</strong><span>BAIRRO RESIDENCIAL · SETOR LESTE</span></div>
<div class="bottomleft"><div class="portrait">♟</div><div class="charname">ALEX MORGAN<small>SOBREVIVENTE · DIA 01</small></div></div><div class="hotbar" id="hotbar"></div><div class="hint"><kbd>WASD</kbd> MOVER&nbsp; <kbd>E</kbd> INTERAGIR<br><kbd>I</kbd> MOCHILA&nbsp; <kbd>C</kbd> FABRICAR</div><div class="interact" id="interact"><b>[ E ]</b> <span>INTERAGIR</span></div><div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><section class="window"><header class="window-head"><div><small id="panel-eyebrow">AFTER THE FALL</small><h2 id="panel-title">MOCHILA</h2></div><button class="close" id="close">×</button></header><div class="window-body" id="panel-body"></div></section></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,camera={x:0,y:0};
const TILE={w:56,h:28}, mapSize=40;const player={x:20,y:20,px:0,py:0,energy:100,dir:0,moving:false};player.px=player.x;player.py=player.y;
const items={water:{name:'Água limpa',icon:'◒',weight:.5},canned:{name:'Feijão enlatado',icon:'▣',weight:.4},wood:{name:'Madeira',icon:'▤',weight:1},scrap:{name:'Sucata',icon:'⚙',weight:.8},cloth:{name:'Tecido',icon:'▧',weight:.2},berry:{name:'Frutas silvestres',icon:'●',weight:.2},bandage:{name:'Atadura',icon:'✚',weight:.1},plank:{name:'Tábua reforçada',icon:'▤',weight:1.5}};
let inventory={water:2,canned:1},day=1,minutes=480,hunger=82,thirst=78,sleep=90,health=100,worldObjects=[],keys={},panel='',nearest=null,selected=0,last=performance.now(),toastTimer;
const seeded=(x,y)=>{let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
function makeWorld(){worldObjects=[];const add=(x,y,type,name,loot,icon)=>worldObjects.push({x,y,type,name,loot,icon,used:false});
// Neighborhood street grid, yards and memorable abandoned details.
for(let y=4;y<37;y+=1)for(let x=4;x<37;x+=1){if((x===12||x===27||y===12||y===27)&&seeded(x,y)>.12)continue;if(seeded(x,y)>.988)add(x,y,'debris','Entulho',{'scrap':1},'▨')}
add(17,17,'house','Casa abandonada',null,'⌂');add(24,16,'house','Casa dos Miller',null,'⌂');add(16,24,'house','Mercado fechado',null,'▤');add(25,24,'house','Oficina',null,'⚒');
add(19,18,'crate','Caixa de mantimentos',{canned:1,water:1},'▣');add(22,20,'tree','Árvore caída',{wood:2},'♠');add(14,17,'bush','Arbusto silvestre',{berry:2},'❋');add(23,14,'mailbox','Caixa de correio',{cloth:1},'▤');add(28,19,'car','Sedan abandonado',{scrap:2},'▰');add(18,26,'pump','Bomba manual',{water:2},'◉');add(12,21,'crate','Mochila esquecida',{cloth:1,canned:1},'▣');add(29,25,'tree','Árvore caída',{wood:2},'♠');add(21,27,'debris','Pilhas de madeira',{wood:1},'▨');
for(let i=0;i<80;i++){let x=5+seeded(i,9)*29|0,y=5+seeded(i,15)*29|0;if(!worldObjects.some(o=>Math.abs(o.x-x)<2&&Math.abs(o.y-y)<2)&&seeded(i,22)>.62)add(x,y,'tree','Pinheiro', {wood:1},'♠')}
}
makeWorld();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function iso(x,y){return{x:(x-y)*TILE.w/2,y:(x+y)*TILE.h/2}}
function screen(x,y){let p=iso(x-camera.x,y-camera.y);return{x:W/2+p.x,y:H/2+p.y}}
function polygon(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function tile(x,y){let p=screen(x,y), shade=seeded(x,y);let col=(x===12||x===27||y===12||y===27)?(x===12||x===27?'#343a34':'#373d36'):(shade>.48?'#424a3d':'#3e463a');polygon([[p.x,p.y],[p.x+28,p.y+14],[p.x,p.y+28],[p.x-28,p.y+14]],col,'#ffffff08');if(x===12||x===27||y===12||y===27){if((x===12||x===27)&&y%3===0){ctx.strokeStyle='#c9b98240';ctx.setLineDash([6,7]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y+27);ctx.stroke();ctx.setLineDash([])}}else if(shade>.92){ctx.fillStyle='#75805d';ctx.fillRect(p.x+7,p.y+14,2,2);ctx.fillRect(p.x-8,p.y+7,2,2)} }
function drawTree(p,large=1){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x+5,p.y+7,17,7,0,0,7);ctx.fill();ctx.fillStyle='#544d3d';ctx.fillRect(p.x-3,p.y-25,7,30);for(let i=0;i<3;i++){ctx.fillStyle=['#536047','#45543e','#65704d'][i];ctx.beginPath();ctx.ellipse(p.x,p.y-34+i*3,19-i*3,21-i*4,0,0,7);ctx.fill()}ctx.fillStyle='#84906a';ctx.beginPath();ctx.arc(p.x-6,p.y-42,4,0,7);ctx.fill()}
function drawHouse(p,o){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x,p.y+5,43,15,0,0,7);ctx.fill();let col=o.name.includes('Mercado')?'#8a8064':o.name.includes('Oficina')?'#77786b':'#9b8a70';polygon([[p.x-29,p.y-20],[p.x,p.y-5],[p.x,p.y-55],[p.x-29,p.y-70]],'#6c6d5e');polygon([[p.x,p.y-5],[p.x+30,p.y-20],[p.x+30,p.y-70],[p.x,p.y-55]],col);polygon([[p.x-29,p.y-70],[p.x,p.y-91],[p.x+30,p.y-70],[p.x,p.y-55]],'#594f43');polygon([[p.x-38,p.y-68],[p.x,p.y-95],[p.x+39,p.y-68],[p.x+30,p.y-64],[p.x,p.y-84],[p.x-29,p.y-64]],'#705b49');ctx.fillStyle='#303c3b';ctx.fillRect(p.x-21,p.y-55,11,13);ctx.fillStyle='#302e27';ctx.fillRect(p.x+8,p.y-34,12,29);ctx.fillStyle='#c3a979';ctx.fillRect(p.x+10,p.y-32,3,3);ctx.fillStyle='#333b36';ctx.fillRect(p.x-1,p.y-72,11,10);ctx.fillStyle='#829080';ctx.fillRect(p.x+2,p.y-70,7,7)}
function drawObject(o){let p=screen(o.x,o.y);if(o.type==='house'){drawHouse(p,o);return}ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x,p.y+3,14,6,0,0,7);ctx.fill();if(o.type==='tree'){drawTree(p);return}if(o.type==='car'){ctx.fillStyle='#585d54';ctx.fillRect(p.x-16,p.y-17,34,13);ctx.fillStyle='#353b38';ctx.fillRect(p.x-11,p.y-24,21,10);ctx.fillStyle='#879080';ctx.fillRect(p.x-8,p.y-22,7,6);ctx.fillRect(p.x+1,p.y-22,6,6);ctx.fillStyle='#1d211e';ctx.fillRect(p.x-12,p.y-5,6,5);ctx.fillRect(p.x+9,p.y-5,6,5)}else if(o.type==='bush'){ctx.fillStyle='#697451';ctx.beginPath();ctx.arc(p.x-5,p.y-9,9,0,7);ctx.arc(p.x+5,p.y-10,8,0,7);ctx.fill();ctx.fillStyle='#bc765d';ctx.fillRect(p.x-5,p.y-11,3,3);ctx.fillRect(p.x+5,p.y-13,3,3)}else if(o.type==='pump'){ctx.fillStyle='#777b6c';ctx.fillRect(p.x-3,p.y-19,6,19);ctx.fillRect(p.x-10,p.y-20,20,4);ctx.fillStyle='#b8b39a';ctx.fillRect(p.x+2,p.y-25,3,8)}else{ctx.fillStyle=o.used?'#47483f':'#786d54';ctx.fillRect(p.x-11,p.y-16,22,14);ctx.fillStyle='#a39a78';ctx.fillRect(p.x-8,p.y-15,16,3);ctx.fillStyle='#2d3029';ctx.fillRect(p.x-2,p.y-11,4,4)}if(nearest===o){ctx.strokeStyle='#e3d29c';ctx.setLineDash([3,3]);ctx.beginPath();ctx.ellipse(p.x,p.y-3,20,9,0,0,7);ctx.stroke();ctx.setLineDash([])}}
function drawPlayer(){let p=screen(player.x,player.y);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(p.x,p.y+2,9,4,0,0,7);ctx.fill();ctx.fillStyle='#6b5142';ctx.fillRect(p.x-5,p.y-17,10,14);ctx.fillStyle='#c29b79';ctx.beginPath();ctx.arc(p.x,p.y-21,5,0,7);ctx.fill();ctx.fillStyle='#262b25';ctx.fillRect(p.x-5,p.y-26,10,4);ctx.fillStyle='#aaa27e';ctx.fillRect(p.x-7,p.y-14,4,8);ctx.fillRect(p.x+3,p.y-14,4,8);if(player.moving){ctx.fillStyle='#292a24';ctx.fillRect(p.x-5,p.y-4,4,5);ctx.fillRect(p.x+2,p.y-4,4,5)}}
function nearestObject(){let best=null,dist=2.1;for(const o of worldObjects){if(o.used)continue;let d=Math.hypot(o.x-player.x,o.y-player.y);if(d<dist){dist=d;best=o}}return best}
function render(){ctx.clearRect(0,0,W,H);const sky=minutes>360&&minutes<1080?'#697361':'#202b2b';ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);camera.x=player.x;camera.y=player.y;let tiles=[];for(let y=-13;y<14;y++)for(let x=-18;x<19;x++){let tx=Math.floor(player.x)+x,ty=Math.floor(player.y)+y;if(tx>=0&&ty>=0&&tx<mapSize&&ty<mapSize)tiles.push({x:tx,y:ty,k:tx+ty})}tiles.sort((a,b)=>a.k-b.k).forEach(t=>tile(t.x,t.y));let objs=worldObjects.filter(o=>Math.abs(o.x-player.x)<18&&Math.abs(o.y-player.y)<18).sort((a,b)=>a.x+a.y-b.x-b.y);objs.forEach(drawObject);drawPlayer();nearest=nearestObject();let hint=document.getElementById('interact');if(nearest){hint.style.display='block';hint.querySelector('span').textContent=nearest.name.toUpperCase()}else hint.style.display='none';const night=minutes<360||minutes>1080;ctx.fillStyle=night?'#07101c55':'#f1d59d0d';ctx.fillRect(0,0,W,H)}
function addItem(id,n){inventory[id]=(inventory[id]||0)+n;}
function useObject(){if(!nearest)return;const o=nearest;if(o.loot){Object.entries(o.loot).forEach(([id,n])=>addItem(id,n));o.used=true;toast(`${o.name}: recursos adicionados à mochila`);advance(12)}else if(o.type==='house'){toast('A porta está emperrada. (Exploração interna em desenvolvimento)');advance(2)}else toast('Nada útil por aqui.');updateUI()}
function advance(m){minutes+=m;if(minutes>=1440){minutes-=1440;day++;}hunger=Math.max(0,hunger-m*.008);thirst=Math.max(0,thirst-m*.012);sleep=Math.max(0,sleep-m*.006);if(thirst===0||hunger===0)health=Math.max(1,health-.2);updateUI()}
function statRow(icon,label,val){return `<div class="stat"><span class="ico">${icon}</span><div><label>${label}</label><div class="meter"><i style="width:${val}%;background:${val<25?'#bb7755':val<50?'#d8b877':'#a5ae78'}"></i></div></div><small>${Math.round(val)}%</small></div>`}
function updateUI(){document.getElementById('stats').innerHTML=statRow('◌','FOME',hunger)+statRow('◒','SEDE',thirst)+statRow('☾','SONO',sleep)+statRow('✚','SAÚDE',health)+statRow('ϟ','ENERGIA',player.energy);let hour=String(Math.floor(minutes/60)).padStart(2,'0'),min=String(minutes%60).padStart(2,'0');document.getElementById('clock').textContent=`DIA ${String(day).padStart(2,'0')} · ${hour}:${min}`;document.getElementById('condition').textContent=health<30?'FRÁGIL':thirst<25?'DESIDRATADO':hunger<25?'COM FOME':'ESTÁVEL';document.getElementById('weather').textContent=minutes>1080||minutes<360?'☾':'☁';drawHotbar()}
function drawHotbar(){let ids=['water','canned','wood','scrap','cloth'];document.getElementById('hotbar').innerHTML=ids.map((id,i)=>`<div class="slot ${i===selected?'active':''}" data-slot="${i}"><small>${i+1}</small>${items[id].icon}<b>${inventory[id]||''}</b></div>`).join('')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function save(){localStorage.setItem('aftermath-save',JSON.stringify({player:{x:player.x,y:player.y,energy:player.energy},inventory,day,minutes,hunger,thirst,sleep,health,objects:worldObjects.map(o=>o.used)}));toast('PARTIDA SALVA · ESTE MUNDO ESPERA POR VOCÊ');}
function load(){try{let s=JSON.parse(localStorage.getItem('aftermath-save'));if(!s)return;Object.assign(player,s.player);player.px=player.x;player.py=player.y;Object.assign(inventory,s.inventory);day=s.day;minutes=s.minutes;hunger=s.hunger;thirst=s.thirst;sleep=s.sleep;health=s.health;s.objects?.forEach((v,i)=>{if(worldObjects[i])worldObjects[i].used=v});}catch(e){console.warn('Save indisponível',e)}}
function openPanel(type){panel=type;const overlay=document.getElementById('overlay'),body=document.getElementById('panel-body'),title=document.getElementById('panel-title');overlay.classList.add('open');if(type==='inventory'){title.textContent='MOCHILA';let rows=Object.entries(inventory).filter(([,n])=>n>0).map(([id,n])=>`<div class="item"><span class="itemico">${items[id].icon}</span><span class="itemname">${items[id].name}</span><small>${n} un. · ${(items[id].weight*n).toFixed(1)} kg</small>${id==='water'||id==='canned'||id==='berry'?`<button data-use="${id}">USAR</button>`:''}</div>`).join('');body.innerHTML=`<div class="invgrid"><div><div class="section-title">ITENS PESSOAIS</div>${rows||'<div class="empty">Sua mochila está vazia.</div>'}</div><div><div class="section-title">CAPACIDADE</div><div style="font:24px var(--display)">${Object.entries(inventory).reduce((a,[id,n])=>a+items[id].weight*n,0).toFixed(1)} <small style="font:10px var(--mono);color:#9da193">/ 24 KG</small></div><div class="footnote">Objetos encontrados ficam com você. O peso afeta o esforço físico.</div><div class="section-title" style="margin-top:22px">ATALHOS</div><div class="footnote">1–5 seleciona item · I fecha mochila<br>E interage com objetos próximos</div></div></div>`;body.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>consume(b.dataset.use))}else{title.textContent='FABRICAÇÃO';const recipes=[{id:'bandage',name:'Atadura improvisada',need:'2 tecidos',req:{cloth:2},out:1},{id:'plank',name:'Tábua reforçada',need:'2 madeiras',req:{wood:2},out:1}];body.innerHTML=recipes.map(r=>`<div class="recipe"><div><strong>${items[r.id].icon} ${r.name}</strong><small>Requer ${r.need} · Produz 1</small></div><button data-craft="${r.id}" ${Object.entries(r.req).some(([id,n])=>(inventory[id]||0)<n)?'disabled':''}>FABRICAR</button></div>`).join('')+'<div class="footnote">A fabricação consome tempo e energia. Receitas simples não exigem bancada.</div>';body.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>craft(b.dataset.craft))}}
function consume(id){if(!inventory[id])return;inventory[id]--;if(id==='water')thirst=Math.min(100,thirst+35);if(id==='canned')hunger=Math.min(100,hunger+30);if(id==='berry')hunger=Math.min(100,hunger+12);advance(5);toast(`${items[id].name} consumido`);openPanel('inventory')}
function craft(id){let req=id==='bandage'?{cloth:2}:{wood:2};if(Object.entries(req).some(([k,n])=>(inventory[k]||0)<n))return;Object.entries(req).forEach(([k,n])=>inventory[k]-=n);addItem(id,1);player.energy=Math.max(0,player.energy-8);advance(20);toast(`${items[id].name} fabricado`);openPanel('craft')}
function closePanel(){document.getElementById('overlay').classList.remove('open');panel=''}document.getElementById('close').onclick=closePanel;document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closePanel()});document.getElementById('saveBtn').onclick=save;addEventListener('pagehide',save);
function move(dt){let sx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),sy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);player.moving=!!(sx||sy);if(!player.moving){player.energy=Math.min(100,player.energy+dt*1.1);return}let dx=(sx+sy)*.7071,dy=(sy-sx)*.7071,length=Math.hypot(dx,dy);dx/=length;dy/=length;const run=keys.shift&&player.energy>2,speed=(run?3.4:2.1)*dt*(player.energy<20?.72:1);if(run)player.energy=Math.max(0,player.energy-dt*3);let nx=Math.max(2,Math.min(mapSize-3,player.x+dx*speed)),ny=Math.max(2,Math.min(mapSize-3,player.y+dy*speed));if(!worldObjects.some(o=>o.type==='house'&&Math.abs(o.x-nx)<.8&&Math.abs(o.y-ny)<.8)){player.x=nx;player.y=ny}player.dir=Math.atan2(dy,dx)}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true;if(e.repeat)return;if(k==='e'&&!panel)useObject();if(k==='i')panel?closePanel():openPanel('inventory');if(k==='c')panel?closePanel():openPanel('craft');if(k==='escape')closePanel();if(k>='1'&&k<='5'){selected=Number(k)-1;drawHotbar()}if(k==='f'&&!panel){let id=['water','canned','wood','scrap','cloth'][selected];if(id==='water'||id==='canned')consume(id)}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});
document.getElementById('hotbar').addEventListener('click',e=>{let slot=e.target.closest('[data-slot]');if(slot){selected=Number(slot.dataset.slot);drawHotbar()}});canvas.addEventListener('pointerdown',()=>{if(innerWidth<700&&nearest)useObject()});
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!panel){move(dt);if(now%1000<dt*1000){advance(1)}}render();requestAnimationFrame(frame)}
load();updateUI();requestAnimationFrame(frame);
})();
</script></body></html>
